name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static export
        env:
          NEXT_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # PeerJS signaling + ICE config (all optional; see .env.example).
          # Non-secret values live in repo Variables, TURN creds in Secrets.
          NEXT_PUBLIC_PEER_HOST: ${{ vars.PEER_HOST }}
          NEXT_PUBLIC_PEER_PORT: ${{ vars.PEER_PORT }}
          NEXT_PUBLIC_PEER_PATH: ${{ vars.PEER_PATH }}
          NEXT_PUBLIC_PEER_SECURE: ${{ vars.PEER_SECURE }}
          NEXT_PUBLIC_PEER_KEY: ${{ vars.PEER_KEY }}
          NEXT_PUBLIC_STUN_URLS: ${{ vars.STUN_URLS }}
          NEXT_PUBLIC_TURN_URLS: ${{ vars.TURN_URLS }}
          NEXT_PUBLIC_TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          NEXT_PUBLIC_TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
